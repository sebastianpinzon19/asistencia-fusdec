<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"/>
<meta name="theme-color" content="#6366f1"/>
<meta name="description" content="Sistema de control de asistencia FUSDEC - Iniciar sesion"/>
<title>Asistencia FUSDEC - Ingresar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --accent:#6366f1;
  --accent2:#8b5cf6;
  --bg:#0f0f1a;
  --card:#1a1a30;
  --text:#f1f5f9;
  --text2:#94a3b8;
  --text3:#64748b;
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}

html{
  font-size:16px;
  -webkit-text-size-adjust:100%;
}

body{
  font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100dvh;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  padding-bottom:calc(24px + var(--safe-bottom));
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}

/* Background effects */
body::before,body::after{
  content:'';position:fixed;border-radius:50%;
  filter:blur(80px);opacity:.15;pointer-events:none;z-index:0;
}
body::before{
  width:min(400px,80vw);height:min(400px,80vw);
  background:var(--accent);top:-10%;left:-10%;
}
body::after{
  width:min(350px,70vw);height:min(350px,70vw);
  background:var(--accent2);bottom:-10%;right:-10%;
}

.card{
  position:relative;z-index:1;
  background:rgba(26,26,48,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.06);
  border-radius:24px;
  padding:40px 28px 32px;
  max-width:400px;width:100%;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

@media (max-width:400px){
  .card{
    padding:32px 20px 28px;
    border-radius:20px;
  }
}

.logo{
  width:68px;height:68px;border-radius:20px;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;
  box-shadow:0 8px 24px rgba(99,102,241,.4);
}

h1{
  font-size:1.4rem;font-weight:800;margin-bottom:8px;
  background:linear-gradient(135deg,#fff,#a5b4fc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

@media (max-width:360px){
  h1{font-size:1.25rem}
}

.sub{
  font-size:.88rem;color:var(--text3);
  margin-bottom:28px;line-height:1.6;
}

.btn-google{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;padding:14px 20px;border-radius:14px;border:none;
  cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-family:inherit;font-size:1rem;font-weight:700;
  box-shadow:0 6px 20px rgba(99,102,241,.4);
  transition:opacity .2s,transform .15s;
  text-decoration:none;
}

.btn-google:hover{opacity:.95}
.btn-google:active{transform:scale(.98);opacity:.9}

.g-icon{width:22px;height:22px;flex-shrink:0}

.note{
  margin-top:20px;font-size:.72rem;
  color:var(--text3);line-height:1.6;
}
.note strong{color:#a5b4fc}

/* Accessibility */
.btn-google:focus{
  outline:2px solid var(--accent);
  outline-offset:3px;
}

@media (prefers-reduced-motion:reduce){
  .btn-google{transition:none}
  body::before,body::after{animation:none}
}
</style>
</head>
<body>
<main class="card" role="main">
  <div class="logo" aria-hidden="true">&#128203;</div>
  <h1>Asistencia FUSDEC</h1>
  <p class="sub">Sistema de control de asistencia.<br/>Inicia sesion con tu cuenta de Google para continuar.</p>

  <a href="/auth" class="btn-google" role="button">
    <svg class="g-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#fff" d="M44.5 20H24v8h11.7C34.2 33.9 29.7 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.9 0 20-7.9 20-21 0-1.4-.1-2.7-.3-4z" opacity=".9"/>
    </svg>
    Ingresar con Google
  </a>

  <p class="note">Solo cuentas <strong>autorizadas</strong> pueden acceder.<br/>Si no tienes acceso, contacta al administrador.</p>
</main>
</body>
</html>
