<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#6366f1"/>
<title>Asistencia Ensueño – Ingresar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--accent:#6366f1;--accent2:#8b5cf6}
body{font-family:'Inter',system-ui,sans-serif;background:#0f0f1a;color:#f1f5f9;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}

/* BG BLOBS */
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(80px);opacity:.18;pointer-events:none;z-index:0}
body::before{width:400px;height:400px;background:var(--accent);top:-100px;left:-100px}
body::after{width:350px;height:350px;background:var(--accent2);bottom:-80px;right:-80px}

.card{
  position:relative;z-index:1;
  background:rgba(26,26,48,.9);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.07);border-radius:28px;
  padding:44px 32px 36px;max-width:380px;width:100%;text-align:center;
  box-shadow:0 24px 80px rgba(0,0,0,.5);
}
.logo{
  width:72px;height:72px;border-radius:22px;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:2rem;
  box-shadow:0 8px 28px rgba(99,102,241,.45);
}
h1{font-size:1.5rem;font-weight:800;margin-bottom:6px;
   background:linear-gradient(135deg,#fff,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{font-size:.88rem;color:#64748b;margin-bottom:32px;line-height:1.5}

.btn-google{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;padding:14px 20px;border-radius:16px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-family:inherit;font-size:1rem;font-weight:700;
  box-shadow:0 6px 24px rgba(99,102,241,.45);
  transition:opacity .2s,transform .15s;text-decoration:none;
}
.btn-google:active{opacity:.85;transform:scale(.97)}
.g-icon{width:22px;height:22px;flex-shrink:0}

.note{margin-top:20px;font-size:.72rem;color:#475569;line-height:1.6}
.note strong{color:#7c3aed}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📋</div>
  <h1>Asistencia Ensueño</h1>
  <p class="sub">Sistema de control de asistencia.<br/>Inicia sesión con tu cuenta de Google para continuar.</p>

  <a href="/auth" class="btn-google">
    <!-- Google logo SVG -->
    <svg class="g-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <path fill="#fff" d="M44.5 20H24v8h11.7C34.2 33.9 29.7 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.9 0 20-7.9 20-21 0-1.4-.1-2.7-.3-4z" opacity=".9"/>
    </svg>
    Ingresar con Google
  </a>

  <p class="note">Solo cuentas <strong>autorizadas</strong> pueden acceder.<br/>Si no tienes acceso, contacta al administrador.</p>
</div>
</body>
</html>
