<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Acceso denegado</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0f0f1a;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#1a1a30;border:1px solid rgba(239,68,68,.3);border-radius:24px;padding:40px 32px;max-width:420px;width:100%;text-align:center}
.icon{font-size:3.5rem;margin-bottom:20px}
h1{font-size:1.4rem;font-weight:800;color:#ef4444;margin-bottom:10px}
p{color:#94a3b8;font-size:.9rem;line-height:1.6;margin-bottom:8px}
.email{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:12px;padding:10px 16px;font-size:.85rem;font-weight:600;color:#f87171;margin:16px 0}
a{display:inline-block;margin-top:20px;background:rgba(99,102,241,.2);border:1px solid rgba(99,102,241,.4);color:#a5b4fc;padding:10px 24px;border-radius:30px;text-decoration:none;font-size:.88rem;font-weight:600}
a:hover{background:rgba(99,102,241,.35)}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🚫</div>
  <h1>Acceso denegado</h1>
  <p>La cuenta de Google que usaste no tiene permiso para acceder a este sistema.</p>
  <div class="email">{{ email }}</div>
  <p>Pide al administrador que agregue tu correo a la lista de acceso.</p>
  <a href="/auth">← Intentar con otra cuenta</a>
</div>
</body>
</html>
