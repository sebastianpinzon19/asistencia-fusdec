<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"/>
<meta name="theme-color" content="#ef4444"/>
<meta name="description" content="Acceso denegado - Asistencia FUSDEC"/>
<title>Acceso denegado - Asistencia FUSDEC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --red:#ef4444;
  --red-light:#f87171;
  --red-bg:rgba(239,68,68,.12);
  --accent:#6366f1;
  --accent2:#8b5cf6;
  --bg:#0f0f1a;
  --card:#1a1a30;
  --text:#f1f5f9;
  --text2:#94a3b8;
  --text3:#64748b;
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}

html{
  font-size:16px;
  -webkit-text-size-adjust:100%;
}

body{
  font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100dvh;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  padding-bottom:calc(24px + var(--safe-bottom));
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}

/* Background effect */
body::before{
  content:'';position:fixed;border-radius:50%;
  width:min(400px,80vw);height:min(400px,80vw);
  background:var(--red);
  filter:blur(100px);opacity:.1;
  top:50%;left:50%;transform:translate(-50%,-50%);
  pointer-events:none;z-index:0;
}

.card{
  position:relative;z-index:1;
  background:rgba(26,26,48,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(239,68,68,.2);
  border-radius:24px;
  padding:40px 28px 32px;
  max-width:440px;width:100%;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

@media (max-width:400px){
  .card{
    padding:32px 20px 28px;
    border-radius:20px;
  }
}

.icon{
  font-size:3.2rem;margin-bottom:18px;
  display:block;
}

h1{
  font-size:1.3rem;font-weight:800;
  color:var(--red);margin-bottom:12px;
}

@media (max-width:360px){
  h1{font-size:1.15rem}
  .icon{font-size:2.8rem}
}

p{
  color:var(--text2);font-size:.88rem;
  line-height:1.6;margin-bottom:8px;
}

.email{
  background:var(--red-bg);
  border:1px solid rgba(239,68,68,.2);
  border-radius:12px;
  padding:12px 16px;
  font-size:.85rem;font-weight:600;
  color:var(--red-light);
  margin:18px 0;
  word-break:break-all;
}

.back-link{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:18px;
  background:rgba(99,102,241,.12);
  border:1px solid rgba(99,102,241,.25);
  color:#a5b4fc;
  padding:12px 22px;border-radius:24px;
  text-decoration:none;
  font-size:.88rem;font-weight:600;
  transition:background .2s;
}

.back-link:hover,.back-link:active{
  background:rgba(99,102,241,.2);
}

.back-link:focus{
  outline:2px solid var(--accent);
  outline-offset:3px;
}

@media (prefers-reduced-motion:reduce){
  .back-link{transition:none}
}
</style>
</head>
<body>
<main class="card" role="main">
  <span class="icon" aria-hidden="true">&#128683;</span>
  <h1>Acceso denegado</h1>
  <p>La cuenta de Google que usaste no tiene permiso para acceder a este sistema.</p>
  <div class="email" role="status">{{ email }}</div>
  <p>Pide al administrador que agregue tu correo a la lista de acceso.</p>
  <a href="/auth" class="back-link" role="button">
    <span aria-hidden="true">&larr;</span> Intentar con otra cuenta
  </a>
</main>
</body>
</html>
